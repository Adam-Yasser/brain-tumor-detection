# Model
model:
  backbone: "resnet18"
  num_classes: 4
  freeze_backbone: false

# Data
data:
  data_dir: "data/splits"
  batch_size: 8
  num_workers: 0

# Training
training:
  epochs: 20
  learning_rate: 0.001
  weight_decay: 0.0001
  scheduler:
    type: "step"
    step_size: 7
    gamma: 0.1

# Paths
paths:
  model_dir: "outputs/models"
  log_dir: "outputs/logs"
  figure_dir: "outputs/figures"

# Experiment
experiment:
  name: "brain-tumor-detection"
  seed: 42